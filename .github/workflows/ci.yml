name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/this-or-that-server
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/this-or-that-web

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload Trivy SARIF results

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test with Maven (JaCoCo coverage)
        run: mvn clean verify --batch-mode

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

      - name: Run Trivy vulnerability scan (filesystem / dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'   # don't fail the build; alert via Security tab

      - name: Upload Trivy filesystem scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  docker-backend:
    name: Build Backend Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build backend JAR
        run: mvn clean package -pl server -am --batch-mode -DskipTests

      - name: Upload server JAR artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/target/*.jar
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image (local scan)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          load: true
          push: false
          tags: backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy CVE scan on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload backend image scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image

      - name: Push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  docker-frontend:
    name: Build Frontend Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image (local scan)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          load: true
          push: false
          tags: frontend:scan
          build-args: |
            VUE_APP_API_PATH=${{ vars.VUE_APP_API_PATH || secrets.VUE_APP_API_PATH || 'https://this-or-that-api-132973189078.us-central1.run.app' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy CVE scan on frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload frontend image scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image

      - name: Push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VUE_APP_API_PATH=${{ vars.VUE_APP_API_PATH || secrets.VUE_APP_API_PATH || 'https://this-or-that-api-132973189078.us-central1.run.app' }}
          cache-from: type=gha

  deploy-backend:
    name: Deploy Backend to Google Cloud Run
    needs: docker-backend
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download server JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: server/target

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image to Artifact Registry
        env:
          REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/this-or-that/backend"
          docker build -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest ./server
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: this-or-that-api
          image: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}/this-or-that/backend:${{ github.sha }}
          region: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}
          flags: |
            --port=8080
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --allow-unauthenticated

      - name: Show Live API URL
        run: |
          echo "🚀 Backend successfully deployed to: ${{ steps.deploy.outputs.url }}"

  deploy-frontend:
    name: Deploy Frontend to Google Cloud Run
    needs: [docker-frontend, deploy-backend]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image to Artifact Registry
        env:
          REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          BACKEND_URL: ${{ vars.VUE_APP_API_PATH || secrets.VUE_APP_API_PATH || needs.deploy-backend.outputs.url || 'https://this-or-that-api-132973189078.us-central1.run.app' }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/this-or-that/frontend"
          docker build \
            --build-arg VUE_APP_API_PATH="${BACKEND_URL}" \
            -t ${IMAGE}:${{ github.sha }} \
            -t ${IMAGE}:latest ./web
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: this-or-that-web
          image: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}/this-or-that/frontend:${{ github.sha }}
          region: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}
          flags: |
            --port=8080
            --memory=256Mi
            --min-instances=0
            --max-instances=2
            --allow-unauthenticated

      - name: Show Live Frontend URL
        run: |
          echo "🚀 Frontend successfully deployed to: ${{ steps.deploy.outputs.url }}"
