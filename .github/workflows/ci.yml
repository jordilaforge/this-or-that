name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/this-or-that-server
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/this-or-that-web

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload Trivy SARIF results

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test with Maven (JaCoCo coverage)
        run: mvn clean verify --batch-mode

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: server/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

      - name: Run Trivy vulnerability scan (filesystem / dependencies)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'   # don't fail the build; alert via Security tab

      - name: Upload Trivy filesystem scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  docker-backend:
    name: Build Backend Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build backend JAR
        run: mvn clean package -pl server -am --batch-mode -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image (local scan)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          load: true
          push: false
          tags: backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy CVE scan on backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload backend image scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image

      - name: Push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  docker-frontend:
    name: Build Frontend Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image (local scan)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          load: true
          push: false
          tags: frontend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy CVE scan on frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload frontend image scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-image

      - name: Push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
