# Specify the name of your springboot application. This can be any logical name you would like to give to your app.
spring.application.name=This-Or-That

# OpenAPI & Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Voting Mode Configuration
# Maximum number of pairwise comparisons (n*(n-1)/2) for exhaustive voting mode.
# If total comparisons <= threshold, exhaustive mode is used (each voter compares all pairs once).
# Otherwise, endless mode is used. Default: 45 comparisons (10 images).
survey.voting.exhaustive-threshold=45
